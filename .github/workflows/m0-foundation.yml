name: M0 Foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: m0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build Android debug APK
        run: gradle :android:app:assembleDebug --stacktrace
      - name: Upload M0 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: secretmode-m0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  crypto-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo test
        run: cargo test --manifest-path crypto-spike/Cargo.toml

  crypto-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android NDK
        run: sdkmanager "ndk;28.2.13676358"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build vodozemac JNI library for arm64-v8a
        working-directory: crypto-spike
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo ndk -t arm64-v8a --platform 30 -o android-jni build --release
      - name: Verify native library exists
        run: test -s crypto-spike/android-jni/arm64-v8a/libsecretmode_crypto_spike.so
      - name: Upload Android ARM64 crypto library
        uses: actions/upload-artifact@v4
        with:
          name: secretmode-crypto-arm64
          path: crypto-spike/android-jni/arm64-v8a/libsecretmode_crypto_spike.so
          if-no-files-found: error
