name: M0 Foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: m0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.5.0'
      - name: Build Android debug APK
        run: gradle :android:app:assembleDebug --stacktrace
      - name: Upload M0 debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secretmode-m0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  crypto-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
      - name: Cargo test
        run: cargo test --manifest-path crypto-spike/Cargo.toml

  crypto-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android SDK and pinned NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.5.0'
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build vodozemac JNI library for arm64-v8a
        working-directory: crypto-spike
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a --platform 30 -o android-jni build --release
      - name: Verify native library exists
        run: test -s crypto-spike/android-jni/arm64-v8a/libsecretmode_crypto_spike.so
      - name: Package native library into Android source tree
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp crypto-spike/android-jni/arm64-v8a/libsecretmode_crypto_spike.so android/app/src/main/jniLibs/arm64-v8a/
      - name: Build ARM64 crypto APK
        run: gradle :android:app:assembleDebug --stacktrace
      - name: Verify APK contains JNI library
        run: unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -F "lib/arm64-v8a/libsecretmode_crypto_spike.so"
      - name: Upload Android ARM64 crypto library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secretmode-crypto-arm64
          path: crypto-spike/android-jni/arm64-v8a/libsecretmode_crypto_spike.so
          if-no-files-found: error
      - name: Upload ARM64 crypto APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secretmode-m0-arm64-crypto-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  crypto-android-jni-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: x86_64-linux-android
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android SDK and pinned NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.5.0'
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build vodozemac JNI library for x86_64 emulator
        working-directory: crypto-spike
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          cargo ndk -t x86_64 --platform 30 -o android-jni build --release
      - name: Package x86_64 JNI library
        run: |
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp crypto-spike/android-jni/x86_64/libsecretmode_crypto_spike.so android/app/src/main/jniLibs/x86_64/
      - name: Build app and instrumentation APKs
        run: gradle :android:app:assembleDebug :android:app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run JNI probe inside Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.yongpingbone.secretmode.test/com.yongpingbone.secretmode.crypto.CryptoProbeInstrumentation | tee /tmp/secretmode-jni-probe.txt
            grep -F "secretmode_result=ok" /tmp/secretmode-jni-probe.txt
            grep -F "probe=vodozemac-0.10.0" /tmp/secretmode-jni-probe.txt

  supply-chain-capture:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'm0-foundation' &&
      github.actor == 'yongpingbone'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout actual PR head for one-time lock capture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: m0-foundation
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
      - name: Generate deterministic Rust lockfile and license inventory
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path crypto-spike/Cargo.toml
          cargo metadata --manifest-path crypto-spike/Cargo.toml --format-version 1 --locked > /tmp/secretmode-cargo-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/secretmode-cargo-metadata.json').read_text())
          packages = []
          for package in data['packages']:
              if package['name'] == 'secretmode-crypto-spike':
                  continue
              packages.append((
                  package['name'],
                  package['version'],
                  package.get('license') or 'UNKNOWN',
                  package.get('source') or 'workspace/path',
              ))
          packages.sort(key=lambda row: (row[0].lower(), row[1]))
          unknown = [row for row in packages if row[2] == 'UNKNOWN']
          lines = [
              '# Rust Dependency License Inventory',
              '',
              'Generated from `cargo metadata --locked` using Rust 1.98.0.',
              'This is an inventory for review, not a substitute for third-party license notices or legal review.',
              '',
              f'Resolved packages: **{len(packages)}**',
              '',
              '| Package | Version | Declared license | Source |',
              '| --- | --- | --- | --- |',
          ]
          for name, version, license_expr, source in packages:
              lines.append(f'| `{name}` | `{version}` | `{license_expr}` | `{source}` |')
          lines += ['', f'Packages with UNKNOWN license metadata: **{len(unknown)}**', '']
          Path('docs/RUST_DEPENDENCIES.md').write_text('\n'.join(lines), encoding='utf-8')
          if unknown:
              raise SystemExit('Dependency license metadata contains UNKNOWN entries')
          PY
      - name: Commit captured lockfile and inventory once
        run: |
          set -euo pipefail
          git add crypto-spike/Cargo.lock docs/RUST_DEPENDENCIES.md
          if git diff --cached --quiet; then
            echo "Lockfile and inventory already current; no capture commit needed."
            exit 0
          fi
          git config user.name "secretmode-supply-chain-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(supply-chain): lock Rust dependency graph"
          git push origin HEAD:m0-foundation
