name: M0 Foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: m0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build Android debug APK
        run: gradle :android:app:assembleDebug --stacktrace
      - name: Upload M0 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: secretmode-m0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  crypto-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo test
        run: cargo test --manifest-path crypto-spike/Cargo.toml

  crypto-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and pinned NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build vodozemac JNI library for arm64-v8a
        working-directory: crypto-spike
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo ndk -t arm64-v8a --platform 30 -o android-jni build --release
      - name: Verify native library exists
        run: test -s crypto-spike/android-jni/arm64-v8a/libsecretmode_crypto_spike.so
      - name: Package native library into Android source tree
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp crypto-spike/android-jni/arm64-v8a/libsecretmode_crypto_spike.so android/app/src/main/jniLibs/arm64-v8a/
      - name: Build ARM64 crypto APK
        run: gradle :android:app:assembleDebug --stacktrace
      - name: Verify APK contains JNI library
        run: unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -F "lib/arm64-v8a/libsecretmode_crypto_spike.so"
      - name: Upload Android ARM64 crypto library
        uses: actions/upload-artifact@v4
        with:
          name: secretmode-crypto-arm64
          path: crypto-spike/android-jni/arm64-v8a/libsecretmode_crypto_spike.so
          if-no-files-found: error
      - name: Upload ARM64 crypto APK
        uses: actions/upload-artifact@v4
        with:
          name: secretmode-m0-arm64-crypto-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  crypto-android-jni-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and pinned NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build vodozemac JNI library for x86_64 emulator
        working-directory: crypto-spike
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo ndk -t x86_64 --platform 30 -o android-jni build --release
      - name: Package x86_64 JNI library
        run: |
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp crypto-spike/android-jni/x86_64/libsecretmode_crypto_spike.so android/app/src/main/jniLibs/x86_64/
      - name: Build app and instrumentation APKs
        run: gradle :android:app:assembleDebug :android:app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run JNI probe inside Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.yongpingbone.secretmode.test/com.yongpingbone.secretmode.crypto.CryptoProbeInstrumentation | tee /tmp/secretmode-jni-probe.txt
            grep -F "secretmode_result=ok" /tmp/secretmode-jni-probe.txt
            grep -F "probe=vodozemac-0.10.0" /tmp/secretmode-jni-probe.txt
